name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # weekly: catches new advisories and upstream breakage

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[lint]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (py${{ matrix.python }}, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        engine: [python-only, with-re2]
        include:
          # Oldest supported pandas, to keep the `pandas>=` floor honest.
          - python: "3.10"
            engine: min-deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        shell: bash
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          extras="test"
          if [ "$ENGINE" = "with-re2" ]; then extras="test,fast"; fi
          pip install -e ".[${extras}]"
          if [ "$ENGINE" = "min-deps" ]; then pip install "pandas==1.5.3" "numpy<2"; fi
          pip list
      - name: Test
        # Coverage gate on one cell only; the others just need to pass.
        run: >
          pytest -ra
          ${{ matrix.python == '3.12' && matrix.engine == 'with-re2' && '--cov --cov-report=term-missing --cov-fail-under=95' || '' }}
      - name: Engines are exercised
        if: matrix.engine == 'with-re2'
        run: |
          python -c "import re2"
          python benchmarks/bench_scan.py re2 20000
          python benchmarks/bench_scan.py python 20000

  build:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke test the wheel in a clean venv (package data included)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python - <<'PY'
          import pandas as pd
          from piigate import load_ruleset, scan_dataframe
          assert len(load_ruleset("uk_gdpr")) == 10
          r = scan_dataframe(pd.DataFrame({"c": ["a@b.co", "fine"]}), ["c"])
          assert not r.ok and list(r.failed_columns) == ["c"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit -e ".[fast]"
      - run: pip-audit --skip-editable

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, build]  # audit is advisory: new CVEs shouldn't block unrelated PRs
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
