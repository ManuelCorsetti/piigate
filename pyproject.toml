[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piigate"
version = "0.1.0"
description = "Lightweight PII scanning gate for data ingestion pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery"]
fast = ["google-re2"]
test = ["pytest", "pytest-cov"]
lint = ["ruff", "mypy", "pandas-stubs"]
dev = ["piigate[test,lint,fast]", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/piigate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["piigate"]
branch = true
