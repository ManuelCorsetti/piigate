[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piigate"
version = "0.1.0"
description = "Lightweight PII scanning gate for data ingestion pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/piigate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
